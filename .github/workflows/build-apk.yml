name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm --prefix apps/mobile install

      - name: Build Web Assets
        run: |
          npm --prefix apps/mobile run build

      - name: Sync Capacitor Android
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caminos-rurales-tejedor-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: android-apk-latest
          name: "Caminos Tejedor Android APK (Versión Nativa)"
          body: "Descargá el archivo APK adjunto directamente en tu teléfono Android para probar la grabación GPS en segundo plano con pantalla apagada."
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
