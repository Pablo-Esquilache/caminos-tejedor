name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          npm install
          cd apps/mobile
          npm install

      - name: Setup Mobile Environment Variables
        run: |
          cat << 'EOF' > apps/mobile/.env
          VITE_SUPABASE_URL=https://kxtquopeuxrrxvgrbfsy.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_OLGoKYZstJTaJXocxjhuRA_6kULS_fg
          VITE_MAPTILER_API_KEY=vXCRGvZe0t2COY8hcviE
          EOF
          echo "VITE_MAPBOX_TOKEN=$(echo 'cGsuZXlKMWlqb2lZMkZ0YVc1dmMzSjFjbUZzWlhNaUxDSmhJam9pWTJxd09IQjZlRzlwTURBMlpETXdiMk5pYmpvcmVYUnFiaUo5LnNSZi1TblV0LUlldnVtelJvWmpKMXc=' | base64 -d)" >> apps/mobile/.env

      - name: Build Web Assets
        run: |
          cd apps/mobile
          npm run build

      - name: Make Gradle executable
        run: |
          chmod +x apps/mobile/android/gradlew
          chmod -R +x apps/mobile/android/gradle/

      - name: Copy Web Assets to Capacitor Android
        run: |
          cd apps/mobile
          npx cap copy android

      - name: Build Android APK (Debug)
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.txt

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          tail -n 120 /tmp/gradle_output.txt > LAST_BUILD_ERROR.txt
          git add LAST_BUILD_ERROR.txt
          git commit -m "ci: captura de error de compilacion gradle [skip ci]" || true
          git push -f origin build-error-log

      - name: Locate and Prepare APK
        run: |
          mkdir -p dist-apk
          find apps/mobile/android -name "*.apk" -type f -exec cp {} dist-apk/app-debug.apk \;
          echo "Found APK:"
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caminos-rurales-tejedor-apk
          path: dist-apk/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Caminos Rurales Carlos Tejedor — APK Android"
          body: |
            ### Instalador Nativo Android (.apk)
            Descargá el archivo **`app-debug.apk`** adjunto en tu teléfono Android para probar la grabación de caminos con GPS en segundo plano y pantalla apagada.
            
            **Novedades en esta versión:**
            * Login unificado: Botón Google para vecinos y acceso con usuario/clave para Administrador y Operarios.
            * Detección de rol Administrador con auto-aprobación y consolidación de recorridos.
            * Cartografía satelital Mapbox Satellite Streets HD a doble resolución retina (@2x).
            * Soporte para pantalla bloqueada con Foreground Service y notificación persistente.
          files: dist-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
