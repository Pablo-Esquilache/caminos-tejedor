<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <clipPath id="territorial-clip">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Fondo blanco del círculo -->
  <circle cx="64" cy="64" r="56" fill="#FFFFFF" />

  <g clip-path="url(#territorial-clip)">
    <!-- Lomas verdes en el horizonte -->
    <path d="M 6 77 Q 34 62 62 76 L 62 88 L 6 88 Z" fill="#39845C" />
    <path d="M 66 76 Q 94 62 122 77 L 122 88 L 66 88 Z" fill="#39845C" />

    <!-- Campos rurales (Verde Tejedor) -->
    <path d="M 6 81 Q 35 72 64 77 Q 93 72 122 81 L 122 124 L 6 124 Z" fill="#245B45" />

    <!-- Líneas blancas divisorias de parcelas -->
    <path d="M 8 81 Q 35 72 64 77 Q 93 72 120 81" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 8 92 Q 33 84 57 88" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 12 106 Q 31 99 48 102" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 71 88 Q 95 84 120 92" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 75 102 Q 97 99 116 106" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Camino rural sinuoso (Tierra / Tosca) con borde blanco -->
    <path
      d="M 64 76 C 69 82, 57 93, 35 122 L 73 122 C 74 96, 77 83, 64 76 Z"
      fill="#C58B45"
      stroke="#FFFFFF"
      stroke-width="3.2"
      stroke-linejoin="round"
    />

    <!-- Pin GPS -->
    <path
      d="M 64 22 C 53 22 45 30.5 45 41.5 C 45 54.5 64 72.5 64 72.5 C 64 72.5 83 54.5 83 41.5 C 83 30.5 75 22 64 22 Z"
      fill="#245B45"
    />
    <circle cx="64" cy="41.5" r="7.5" fill="#FFFFFF" />
  </g>

  <!-- Aro exterior Verde Tejedor -->
  <circle cx="64" cy="64" r="56" stroke="#245B45" stroke-width="7" />
</svg>
